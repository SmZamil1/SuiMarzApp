name: Build SuiMarz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Unzip and Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip project
        run: |
          echo "=== Repo contents ==="
          ls -la
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "Unzipping: $ZIP"
          unzip -q "$ZIP" -d extracted/
          echo "=== Extracted top level ==="
          ls extracted/
          ROOT=$(find extracted/ -name "build.gradle" ! -path "*/app/build.gradle" | head -1 | xargs dirname)
          echo "Project root: $ROOT"
          mkdir -p $GITHUB_WORKSPACE/project
          cp -r "$ROOT/." $GITHUB_WORKSPACE/project/
          echo "=== Project ==="
          ls $GITHUB_WORKSPACE/project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x $GITHUB_WORKSPACE/project/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd $GITHUB_WORKSPACE/project
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuiMarz-APK
          path: ${{ github.workspace }}/project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Done
        run: echo "SUCCESS - APK is ready to download from Artifacts"
